name: bump-v053

on:
  push:
    paths:
      - '.github/workflows/bump-v053.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align backend version with deployed UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('version="0.5.1"', 'version="0.5.3"')
          text = text.replace('"version":"0.5.1"', '"version":"0.5.3"')
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile backend/main.py backend/strength_api.py backend/strength_plan.py
      - name: Commit
        run: |
          git config user.name "sport-bot"
          git config user.email "sport-bot@users.noreply.github.com"
          git add backend/main.py
          if git diff --cached --quiet; then
            echo "Already v0.5.3"
          else
            git commit -m "Align dashboard backend version to v0.5.3"
            git push origin main
          fi
