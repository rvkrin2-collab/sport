name: run-legacy-strength-v054

on:
  push:
    paths:
      - '.github/workflows/run-legacy-strength-v054.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix_legacy_strength_v054.py
      - run: python -m py_compile backend/main.py backend/strength_api.py backend/strength_plan.py
      - run: node --check strength-ui.js
      - run: |
          git config user.name "sport-bot"
          git config user.email "sport-bot@users.noreply.github.com"
          git add backend/strength_api.py backend/main.py strength-ui.js index.html
          git commit -m "Show legacy completed strength sessions in editable history v0.5.4"
          git push origin main
