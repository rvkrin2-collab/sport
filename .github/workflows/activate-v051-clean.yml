name: activate-v051-clean

on:
  push:
    paths:
      - '.github/workflows/activate-v051-clean.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/activate_v051.py
      - run: |
          git config user.name "sport-bot"
          git config user.email "sport-bot@users.noreply.github.com"
          git add app.js index.html backend/main.py
          if git diff --cached --quiet; then
            echo "Already activated"
          else
            git commit -m "Activate strength per-set UI v0.5.1"
            git push origin main
          fi
