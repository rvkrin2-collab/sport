name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile backend/main.py backend/strength_api.py backend/strength_plan.py
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app

          with TestClient(app) as client:
              assert client.get('/api/health').status_code == 200
              r = client.get('/api/strength/current')
              assert r.status_code == 200, r.text
              data = r.json()
              assert data['next']['number'] == 1
              assert len(data['next']['exercises']) == 6
              print(app.title, app.version, data['next']['type'])
          PY
